# =============================================================================
# nginx.ha.conf — HA release profile LB config (compose.release.ha.json)
#
# Both upstream replicas are the compose services ai-gateway-a/ai-gateway-b.
# Passive health checking only (OSS nginx): three consecutive failures in
# 30 s remove a peer from rotation until a probe succeeds. The published
# listener stays loopback-only; TLS termination remains the operator's
# external concern exactly as in deploy/nginx.conf.
# =============================================================================

upstream ai_gateway_ha {
    server ai-gateway-a:3100 max_fails=3 fail_timeout=30s;
    server ai-gateway-b:3100 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    # Security headers mirror deploy/nginx.conf.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        proxy_pass http://ai_gateway_ha;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite any client-supplied forwarding chain to prevent spoofing.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
