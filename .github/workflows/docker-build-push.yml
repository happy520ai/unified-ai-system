name: Docker Build & Push

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      push:
        description: "Push image to registry"
        required: false
        default: "true"

permissions:
  contents: read
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ai-gateway-service
  MCP_IMAGE_NAME: ${{ github.repository }}/mcp-server
  MCP_PUBLISHER_VERSION: v1.8.0
  MCP_PUBLISHER_LINUX_AMD64_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js (for pre-flight checks)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Workspace check
        run: pnpm -r --if-present check

      - name: Public repository hygiene
        run: pnpm check:public

      - name: Smoke-test container image
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          mkdir -p .tmp
          touch \
            .tmp/docker-smoke-gateway-demo.json \
            .tmp/docker-smoke-piped-demo.json \
            .tmp/docker-smoke-container-evidence.json \
            .tmp/docker-smoke-mcp-smoke.json \
            .tmp/docker-smoke-tools-mcp-smoke.json \
            .tmp/docker-smoke-openai-sdk-chat.log \
            .tmp/docker-smoke-container-runtime.log \
            .tmp/docker-smoke-base-url.json
          docker build --tag unified-ai-system-smoke .
          docker build \
            --target mcp \
            --tag unified-ai-system-mcp-smoke \
            .
          docker run --rm \
            --env AI_GATEWAY_PROVIDER_MODE=fake \
            --env AI_GATEWAY_REAL_PROVIDER_ENABLED=false \
            --env PME_ENTERPRISE_AUTH_ENABLED=false \
            unified-ai-system-smoke \
            pnpm gateway demo --json 2>&1 | tee .tmp/docker-smoke-gateway-demo.json
          piped_evidence="$(printf '%s' 'Container stdin evidence test' | \
            docker run --rm -i \
            --env AI_GATEWAY_PROVIDER_MODE=fake \
            --env AI_GATEWAY_REAL_PROVIDER_ENABLED=false \
            --env PME_ENTERPRISE_AUTH_ENABLED=false \
            unified-ai-system-smoke \
            pnpm --silent gateway demo --enhance --profile coding --language en --json \
            2>&1 | tee .tmp/docker-smoke-piped-demo.json)"
          extract_json() { node --input-type=module -e 'const s=process.argv[1];const a=s.indexOf("{");const b=s.lastIndexOf("}");if(a<0||b<a)process.exit(1);process.stdout.write(s.slice(a,b+1));' "$1"; }
          PIPED_EVIDENCE_JSON="$(extract_json "${piped_evidence}")" node --input-type=module <<'NODE'
          const evidence = JSON.parse(process.env.PIPED_EVIDENCE_JSON);
          const enhancement = evidence.promptEnhancement;
          const checks = {
            mode: evidence.executionMode === "fake",
            original: enhancement?.original === "Container stdin evidence test",
            providerCalled: enhancement?.metadata?.providerCalled === false,
            credentialRequired: enhancement?.metadata?.credentialRequired === false,
            deterministic: enhancement?.metadata?.deterministic === true,
            enhancedPrompt: typeof enhancement?.enhancedPrompt === "string"
              && enhancement.enhancedPrompt.length > 0,
          };
          console.log(JSON.stringify(checks));
          if (!Object.values(checks).every(Boolean)) process.exit(1);
          NODE
          enhancement_evidence="$(docker run --rm \
            --env AI_GATEWAY_PROVIDER_MODE=fake \
            --env AI_GATEWAY_REAL_PROVIDER_ENABLED=false \
            --env PME_ENTERPRISE_AUTH_ENABLED=false \
            --env AI_GATEWAY_SERVICE_HOST=127.0.0.1 \
            unified-ai-system-smoke \
            sh -c '
              pnpm gateway serve >/tmp/gateway.log 2>&1 &
              pid=$!
              trap "kill $pid 2>/dev/null || true" EXIT
              ready=false
              for attempt in $(seq 1 30); do
                if pnpm --silent gateway status --json >/tmp/status.json 2>/dev/null; then
                  ready=true
                  break
                fi
                sleep 1
              done
              if [ "$ready" != true ]; then
                cat /tmp/gateway.log
                exit 1
              fi
              pnpm --silent gateway enhance "Container evidence test" --profile coding --language en --evidence
            ' | tee .tmp/docker-smoke-container-evidence.json)"
          EVIDENCE_JSON="$(extract_json "${enhancement_evidence}")" node --input-type=module <<'NODE'
          const evidence = JSON.parse(process.env.EVIDENCE_JSON);
          const checks = {
            schema: evidence.schema === "unified-ai-system/usage-report/v1",
            mode: evidence.mode === "prompt-enhancement",
            providerCalled: evidence.providerCalled === false,
            credentialRequired: evidence.credentialRequired === false,
            deterministic: evidence.deterministic === true,
            original: evidence.original === "Container evidence test",
            enhancedPrompt: typeof evidence.enhancedPrompt === "string"
              && evidence.enhancedPrompt.length > 0,
          };
          console.log(JSON.stringify(checks));
          if (!Object.values(checks).every(Boolean)) process.exit(1);
          NODE
          docker run --rm \
            --env AI_GATEWAY_PROVIDER_MODE=fake \
            --env AI_GATEWAY_REAL_PROVIDER_ENABLED=false \
            --env PME_ENTERPRISE_AUTH_ENABLED=false \
            unified-ai-system-smoke \
            pnpm smoke:mcp --json 2>&1 | tee .tmp/docker-smoke-mcp-smoke.json
          node tools/mcp-smoke.mjs \
            --docker-image=unified-ai-system-mcp-smoke \
            --json 2>&1 | tee .tmp/docker-smoke-tools-mcp-smoke.json
          container_id="$(docker run --detach \
            --publish 127.0.0.1::3100 \
            --env AI_GATEWAY_PROVIDER_MODE=fake \
            --env AI_GATEWAY_REAL_PROVIDER_ENABLED=false \
            --env PME_AUTH_TOKEN=local-smoke-admin-token-0123456789abcdef0123456789 \
            unified-ai-system-smoke)"
          cleanup() {
            docker rm --force "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          host_port="$(docker port "${container_id}" 3100/tcp | sed 's/.*://')"
          export SMOKE_BASE_URL="http://127.0.0.1:${host_port}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent "${SMOKE_BASE_URL}/health/check" >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              docker logs "${container_id}" > .tmp/docker-smoke-container-runtime.log
              docker logs "${container_id}"
              exit 1
            fi
            sleep 1
          done
          echo "{ \"smokeBaseUrl\": \"${SMOKE_BASE_URL}\" }" > .tmp/docker-smoke-base-url.json
          PME_AUTH_TOKEN=local-smoke-admin-token-0123456789abcdef0123456789 \
          node tools/docker-container-checks.mjs
          AI_GATEWAY_SERVICE_URL="${SMOKE_BASE_URL}" \
            PME_AUTH_TOKEN=local-smoke-admin-token-0123456789abcdef0123456789 \
            node docs/examples/openai-sdk-chat.mjs 2>&1 | tee .tmp/docker-smoke-openai-sdk-chat.log

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract MCP metadata (tags, labels)
        id: mcp-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.MCP_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
          platforms: linux/amd64

      - name: Build and push MCP image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          target: mcp
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.mcp-meta.outputs.tags }}
          labels: ${{ steps.mcp-meta.outputs.labels }}
          cache-from: |
            type=gha,scope=mcp
            type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=mcp
          platforms: linux/amd64

      # arm64 腿独立且非阻断：qemu 模拟下的网络下载在 CI 基础设施波动时
      # 会确定性失败（exit 255）；amd64 主发布不受影响，arm64 恢复后由
      # workflow_dispatch 或下次发布补齐。
      - name: Build and push arm64 images (best effort)
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.mcp-meta.outputs.tags }}
          labels: ${{ steps.mcp-meta.outputs.labels }}
          cache-from: |
            type=gha,scope=mcp
            type=gha,scope=gateway
          platforms: linux/arm64

      - name: Verify published images anonymously
        if: github.event_name != 'pull_request' && (github.event.inputs.push != 'false')
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          mkdir -p .tmp
          touch \
            .tmp/docker-published-gateway-demo.json \
            .tmp/docker-published-mcp-smoke.json \
            .tmp/docker-published-tools-mcp-smoke.json \
            .tmp/docker-published-openai-sdk-chat.log \
            .tmp/docker-published-runtime.log
          anonymous_config="$(mktemp -d)"
          container_id=""
          cleanup() {
            if [ -n "${container_id}" ]; then
              docker rm --force "${container_id}" >/dev/null 2>&1 || true
            fi
            rm -rf "${anonymous_config}"
          }
          trap cleanup EXIT
          export DOCKER_CONFIG="${anonymous_config}"
          image="${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
          mcp_image="${REGISTRY}/${MCP_IMAGE_NAME}:sha-${GITHUB_SHA::7}"
          pull_with_retry() {
            local target_image="$1"
            for attempt in $(seq 1 6); do
              if docker pull "${target_image}"; then
                return 0
              fi
              if [ "${attempt}" -eq 6 ]; then
                return 1
              fi
              sleep 5
            done
          }
          pull_with_retry "${image}"
          pull_with_retry "${mcp_image}"
          # 直接以 node 调用 CLI：pnpm run 的 verify-deps 检查在非 root 的
          # /app 下会偶发触发重装/清库；镜像内依赖已由 frozen-lockfile 锁定。
          docker run --rm \
            --env AI_GATEWAY_PROVIDER_MODE=fake \
            --env AI_GATEWAY_REAL_PROVIDER_ENABLED=false \
            "${image}" \
            node apps/agent-console/src/cli.js demo --json 2>&1 | tee .tmp/docker-published-gateway-demo.json
          docker run --rm \
            --env AI_GATEWAY_PROVIDER_MODE=fake \
            --env AI_GATEWAY_REAL_PROVIDER_ENABLED=false \
            "${image}" \
            node tools/mcp-smoke.mjs --json 2>&1 | tee .tmp/docker-published-mcp-smoke.json
          node tools/mcp-smoke.mjs \
            --docker-image="${mcp_image}" \
            --json 2>&1 | tee .tmp/docker-published-tools-mcp-smoke.json
          container_id="$(docker run --detach \
            --publish 127.0.0.1::3100 \
            --env AI_GATEWAY_PROVIDER_MODE=fake \
            --env AI_GATEWAY_REAL_PROVIDER_ENABLED=false \
            --env PME_AUTH_TOKEN=local-smoke-admin-token-0123456789abcdef0123456789 \
            "${image}")"
          host_port="$(docker port "${container_id}" 3100/tcp | sed 's/.*://')"
          published_base_url="http://127.0.0.1:${host_port}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent "${published_base_url}/health/check" >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              docker logs "${container_id}" > .tmp/docker-published-runtime.log
              docker logs "${container_id}"
              exit 1
            fi
            sleep 1
          done
          AI_GATEWAY_SERVICE_URL="${published_base_url}" \
            PME_AUTH_TOKEN=local-smoke-admin-token-0123456789abcdef0123456789 \
            node docs/examples/openai-sdk-chat.mjs 2>&1 | tee .tmp/docker-published-openai-sdk-chat.log

      - name: Append docker workflow evidence to workflow summary
        if: always()
        run: |
          {
            echo "## Docker smoke evidence"
            echo ""
            if [ -f .tmp/docker-smoke-gateway-demo.json ]; then
              echo "### Container smoke gateway demo"
              cat .tmp/docker-smoke-gateway-demo.json
            fi
            if [ -f .tmp/docker-smoke-piped-demo.json ]; then
              echo ""
              echo "### Container smoke piped demo"
              cat .tmp/docker-smoke-piped-demo.json
            fi
            if [ -f .tmp/docker-smoke-container-evidence.json ]; then
              echo ""
              echo "### Container smoke enhancement evidence"
              cat .tmp/docker-smoke-container-evidence.json
            fi
            if [ -f .tmp/docker-smoke-mcp-smoke.json ]; then
              echo ""
              echo "### Container smoke MCP smoke"
              cat .tmp/docker-smoke-mcp-smoke.json
            fi
            if [ -f .tmp/docker-smoke-tools-mcp-smoke.json ]; then
              echo ""
              echo "### Container smoke tools MCP smoke"
              cat .tmp/docker-smoke-tools-mcp-smoke.json
            fi
            if [ -f .tmp/docker-smoke-openai-sdk-chat.log ]; then
              echo ""
              echo "### Container smoke OpenAI SDK chat"
              cat .tmp/docker-smoke-openai-sdk-chat.log
            fi
            if [ -f .tmp/docker-smoke-container-runtime.log ]; then
              echo ""
              echo "### Container smoke runtime logs"
              cat .tmp/docker-smoke-container-runtime.log
            fi
            if [ -f .tmp/docker-smoke-base-url.json ]; then
              echo ""
              echo "### Container smoke base URL"
              cat .tmp/docker-smoke-base-url.json
            fi
            if [ -f .tmp/docker-published-gateway-demo.json ]; then
              echo ""
              echo "### Published image gateway demo"
              cat .tmp/docker-published-gateway-demo.json
            fi
            if [ -f .tmp/docker-published-mcp-smoke.json ]; then
              echo ""
              echo "### Published image MCP smoke"
              cat .tmp/docker-published-mcp-smoke.json
            fi
            if [ -f .tmp/docker-published-tools-mcp-smoke.json ]; then
              echo ""
              echo "### Published image tools MCP smoke"
              cat .tmp/docker-published-tools-mcp-smoke.json
            fi
            if [ -f .tmp/docker-published-openai-sdk-chat.log ]; then
              echo ""
              echo "### Published image OpenAI SDK chat"
              cat .tmp/docker-published-openai-sdk-chat.log
            fi
            if [ -f .tmp/docker-published-runtime.log ]; then
              echo ""
              echo "### Published image runtime logs"
              cat .tmp/docker-published-runtime.log
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload local docker smoke evidence artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-smoke-evidence
          path: |
            .tmp/docker-smoke-gateway-demo.json
            .tmp/docker-smoke-piped-demo.json
            .tmp/docker-smoke-container-evidence.json
            .tmp/docker-smoke-mcp-smoke.json
            .tmp/docker-smoke-tools-mcp-smoke.json
            .tmp/docker-smoke-openai-sdk-chat.log
            .tmp/docker-smoke-container-runtime.log
            .tmp/docker-smoke-base-url.json

      - name: Upload published docker evidence artifacts
        if: github.event_name != 'pull_request' && (github.event.inputs.push != 'false')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-published-evidence
          path: |
            .tmp/docker-published-gateway-demo.json
            .tmp/docker-published-mcp-smoke.json
            .tmp/docker-published-tools-mcp-smoke.json
            .tmp/docker-published-openai-sdk-chat.log
            .tmp/docker-published-runtime.log

      - name: Install MCP Registry publisher
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location \
            --output "${archive}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" mcp-publisher
          chmod +x mcp-publisher

      - name: Validate MCP Registry metadata
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          expected_image="${REGISTRY}/${MCP_IMAGE_NAME}:${version}"
          test "$(jq -r '.version' server.json)" = "${version}"
          test "$(jq -r '.packages[0].identifier' server.json)" = "${expected_image}"
          ./mcp-publisher validate server.json

      - name: Authenticate to MCP Registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./mcp-publisher publish server.json
