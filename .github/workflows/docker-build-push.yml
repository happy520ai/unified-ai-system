name: Docker Build & Push

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      push:
        description: "Push image to registry"
        required: false
        default: "true"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ai-gateway-service

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js (for pre-flight checks)
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Workspace check
        run: pnpm -r --if-present check

      - name: Public repository hygiene
        run: pnpm check:public

      - name: Smoke-test container image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag unified-ai-system-smoke .
          docker run --rm \
            --env AI_GATEWAY_PROVIDER_MODE=fake \
            --env AI_GATEWAY_REAL_PROVIDER_ENABLED=false \
            unified-ai-system-smoke \
            pnpm gateway demo --json
          container_id="$(docker run --detach \
            --publish 127.0.0.1::3100 \
            --env AI_GATEWAY_PROVIDER_MODE=fake \
            --env AI_GATEWAY_REAL_PROVIDER_ENABLED=false \
            unified-ai-system-smoke)"
          cleanup() {
            docker rm --force "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          host_port="$(docker port "${container_id}" 3100/tcp | sed 's/.*://')"
          export SMOKE_BASE_URL="http://127.0.0.1:${host_port}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent "${SMOKE_BASE_URL}/health/check" >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              docker logs "${container_id}"
              exit 1
            fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          const baseUrl = process.env.SMOKE_BASE_URL;
          const readJson = async (path, options) => {
            const response = await fetch(`${baseUrl}${path}`, options);
            return { status: response.status, body: await response.json() };
          };
          const health = await readJson("/health/check");
          const setup = await readJson("/setup/readiness");
          const ui = await fetch(`${baseUrl}/ui`);
          const chat = await readJson("/chat", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ prompt: "Container smoke test" }),
          });
          const checks = {
            health: health.status === 200 && health.body?.data?.status === "ready",
            setup: setup.status === 200 && setup.body?.data?.status === "ready",
            ui: ui.status === 200,
            fakeProviderDisabledRealCalls: health.body?.data?.realProviderEnabled === false,
            chat: chat.status === 200
              && chat.body?.success === true
              && chat.body?.data?.executionMode === "fake",
          };
          console.log(JSON.stringify(checks));
          if (!Object.values(checks).every(Boolean)) process.exit(1);
          NODE

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Verify published terminal demo anonymously
        if: github.event_name != 'pull_request' && (github.event.inputs.push != 'false')
        shell: bash
        run: |
          set -euo pipefail
          anonymous_config="$(mktemp -d)"
          cleanup() {
            rm -rf "${anonymous_config}"
          }
          trap cleanup EXIT
          export DOCKER_CONFIG="${anonymous_config}"
          image="${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
          for attempt in $(seq 1 6); do
            if docker pull "${image}"; then
              break
            fi
            if [ "${attempt}" -eq 6 ]; then
              exit 1
            fi
            sleep 5
          done
          docker run --rm \
            --env AI_GATEWAY_PROVIDER_MODE=fake \
            --env AI_GATEWAY_REAL_PROVIDER_ENABLED=false \
            "${image}" \
            pnpm gateway demo --json
