name: Docker Build & Push

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      push:
        description: "Push image to registry"
        required: false
        default: "true"

permissions:
  contents: read
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ai-gateway-service
  MCP_IMAGE_NAME: ${{ github.repository }}/mcp-server
  MCP_PUBLISHER_VERSION: v1.8.0
  MCP_PUBLISHER_LINUX_AMD64_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js (for pre-flight checks)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Workspace check
        run: pnpm -r --if-present check

      - name: Public repository hygiene
        run: pnpm check:public

      - name: Smoke-test container image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag unified-ai-system-smoke .
          docker build \
            --target mcp \
            --tag unified-ai-system-mcp-smoke \
            .
          docker run --rm \
            --env AI_GATEWAY_PROVIDER_MODE=fake \
            --env AI_GATEWAY_REAL_PROVIDER_ENABLED=false \
            unified-ai-system-smoke \
            pnpm gateway demo --json
          piped_evidence="$(printf '%s' 'Container stdin evidence test' | docker run --rm -i \
            --env AI_GATEWAY_PROVIDER_MODE=fake \
            --env AI_GATEWAY_REAL_PROVIDER_ENABLED=false \
            unified-ai-system-smoke \
            pnpm --silent gateway demo --enhance --profile coding --language en --json)"
          PIPED_EVIDENCE_JSON="${piped_evidence}" node --input-type=module <<'NODE'
          const evidence = JSON.parse(process.env.PIPED_EVIDENCE_JSON);
          const enhancement = evidence.promptEnhancement;
          const checks = {
            mode: evidence.executionMode === "fake",
            original: enhancement?.original === "Container stdin evidence test",
            providerCalled: enhancement?.metadata?.providerCalled === false,
            credentialRequired: enhancement?.metadata?.credentialRequired === false,
            deterministic: enhancement?.metadata?.deterministic === true,
            enhancedPrompt: typeof enhancement?.enhancedPrompt === "string"
              && enhancement.enhancedPrompt.length > 0,
          };
          console.log(JSON.stringify(checks));
          if (!Object.values(checks).every(Boolean)) process.exit(1);
          NODE
          enhancement_evidence="$(docker run --rm \
            --env AI_GATEWAY_PROVIDER_MODE=fake \
            --env AI_GATEWAY_REAL_PROVIDER_ENABLED=false \
            unified-ai-system-smoke \
            sh -c '
              pnpm gateway serve >/tmp/gateway.log 2>&1 &
              pid=$!
              trap "kill $pid 2>/dev/null || true" EXIT
              ready=false
              for attempt in $(seq 1 30); do
                if pnpm --silent gateway status --json >/tmp/status.json 2>/dev/null; then
                  ready=true
                  break
                fi
                sleep 1
              done
              if [ "$ready" != true ]; then
                cat /tmp/gateway.log
                exit 1
              fi
              pnpm --silent gateway enhance "Container evidence test" --profile coding --language en --evidence
            '
          )"
          EVIDENCE_JSON="${enhancement_evidence}" node --input-type=module <<'NODE'
          const evidence = JSON.parse(process.env.EVIDENCE_JSON);
          const checks = {
            schema: evidence.schema === "unified-ai-system/usage-report/v1",
            mode: evidence.mode === "prompt-enhancement",
            providerCalled: evidence.providerCalled === false,
            credentialRequired: evidence.credentialRequired === false,
            deterministic: evidence.deterministic === true,
            original: evidence.original === "Container evidence test",
            enhancedPrompt: typeof evidence.enhancedPrompt === "string"
              && evidence.enhancedPrompt.length > 0,
          };
          console.log(JSON.stringify(checks));
          if (!Object.values(checks).every(Boolean)) process.exit(1);
          NODE
          docker run --rm \
            --env AI_GATEWAY_PROVIDER_MODE=fake \
            --env AI_GATEWAY_REAL_PROVIDER_ENABLED=false \
            unified-ai-system-smoke \
            pnpm smoke:mcp --json
          node tools/mcp-smoke.mjs \
            --docker-image=unified-ai-system-mcp-smoke \
            --json
          container_id="$(docker run --detach \
            --publish 127.0.0.1::3100 \
            --env AI_GATEWAY_PROVIDER_MODE=fake \
            --env AI_GATEWAY_REAL_PROVIDER_ENABLED=false \
            unified-ai-system-smoke)"
          cleanup() {
            docker rm --force "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          host_port="$(docker port "${container_id}" 3100/tcp | sed 's/.*://')"
          export SMOKE_BASE_URL="http://127.0.0.1:${host_port}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent "${SMOKE_BASE_URL}/health/check" >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              docker logs "${container_id}"
              exit 1
            fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          const baseUrl = process.env.SMOKE_BASE_URL;
          const readJson = async (path, options) => {
            const response = await fetch(`${baseUrl}${path}`, options);
            return { status: response.status, body: await response.json() };
          };
          const health = await readJson("/health/check");
          const setup = await readJson("/setup/readiness");
          const ui = await fetch(`${baseUrl}/ui`);
          const consoleRoute = await fetch(`${baseUrl}/console`);
          const chat = await readJson("/chat", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ prompt: "Container smoke test" }),
          });
          const checks = {
            health: health.status === 200 && health.body?.data?.status === "ready",
            setup: setup.status === 200 && setup.body?.data?.status === "ready",
            terminalFirstSurface: ui.status === 404 && consoleRoute.status === 404,
            fakeProviderDisabledRealCalls: health.body?.data?.realProviderEnabled === false,
            chat: chat.status === 200
              && chat.body?.success === true
              && chat.body?.data?.executionMode === "fake",
          };
          console.log(JSON.stringify(checks));
          if (!Object.values(checks).every(Boolean)) process.exit(1);
          NODE
          AI_GATEWAY_SERVICE_URL="${SMOKE_BASE_URL}" \
            node docs/examples/openai-sdk-chat.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract MCP metadata (tags, labels)
        id: mcp-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.MCP_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
          platforms: linux/amd64,linux/arm64

      - name: Build and push MCP image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          target: mcp
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.mcp-meta.outputs.tags }}
          labels: ${{ steps.mcp-meta.outputs.labels }}
          cache-from: |
            type=gha,scope=mcp
            type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=mcp
          platforms: linux/amd64,linux/arm64

      - name: Verify published images anonymously
        if: github.event_name != 'pull_request' && (github.event.inputs.push != 'false')
        shell: bash
        run: |
          set -euo pipefail
          anonymous_config="$(mktemp -d)"
          container_id=""
          cleanup() {
            if [ -n "${container_id}" ]; then
              docker rm --force "${container_id}" >/dev/null 2>&1 || true
            fi
            rm -rf "${anonymous_config}"
          }
          trap cleanup EXIT
          export DOCKER_CONFIG="${anonymous_config}"
          image="${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
          mcp_image="${REGISTRY}/${MCP_IMAGE_NAME}:sha-${GITHUB_SHA::7}"
          pull_with_retry() {
            local target_image="$1"
            for attempt in $(seq 1 6); do
              if docker pull "${target_image}"; then
                return 0
              fi
              if [ "${attempt}" -eq 6 ]; then
                return 1
              fi
              sleep 5
            done
          }
          pull_with_retry "${image}"
          pull_with_retry "${mcp_image}"
          docker run --rm \
            --env AI_GATEWAY_PROVIDER_MODE=fake \
            --env AI_GATEWAY_REAL_PROVIDER_ENABLED=false \
            "${image}" \
            pnpm gateway demo --json
          docker run --rm \
            --env AI_GATEWAY_PROVIDER_MODE=fake \
            --env AI_GATEWAY_REAL_PROVIDER_ENABLED=false \
            "${image}" \
            pnpm smoke:mcp --json
          node tools/mcp-smoke.mjs \
            --docker-image="${mcp_image}" \
            --json
          container_id="$(docker run --detach \
            --publish 127.0.0.1::3100 \
            --env AI_GATEWAY_PROVIDER_MODE=fake \
            --env AI_GATEWAY_REAL_PROVIDER_ENABLED=false \
            "${image}")"
          host_port="$(docker port "${container_id}" 3100/tcp | sed 's/.*://')"
          published_base_url="http://127.0.0.1:${host_port}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent "${published_base_url}/health/check" >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              docker logs "${container_id}"
              exit 1
            fi
            sleep 1
          done
          AI_GATEWAY_SERVICE_URL="${published_base_url}" \
            node docs/examples/openai-sdk-chat.mjs

      - name: Install MCP Registry publisher
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location \
            --output "${archive}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" mcp-publisher
          chmod +x mcp-publisher

      - name: Validate MCP Registry metadata
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          expected_image="${REGISTRY}/${MCP_IMAGE_NAME}:${version}"
          test "$(jq -r '.version' server.json)" = "${version}"
          test "$(jq -r '.packages[0].identifier' server.json)" = "${expected_image}"
          ./mcp-publisher validate server.json

      - name: Authenticate to MCP Registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./mcp-publisher publish server.json
