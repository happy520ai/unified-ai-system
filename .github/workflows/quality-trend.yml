name: Quality Trend Snapshot

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      quality_threshold:
        description: Minimum quality score required by gate
        required: false
        default: "165"
        type: string
      enforce_trend_guardrails:
        description: Fail if trend guardrails are triggered
        required: false
        default: false
        type: boolean
      quality_trend_hard_block:
        description: Fail if quality trend check reports blocking findings
        required: false
        default: false
        type: boolean
      max_consecutive_failures:
        description: Guardrail threshold for consecutive trend failures
        required: false
        default: "3"
        type: string
      max_score_drop_points:
        description: Guardrail threshold for single-run score drop points
        required: false
        default: "20"
        type: string
      min_pass_rate_percent:
        description: Guardrail threshold for rolling pass-rate percentage
        required: false
        default: "70"
        type: string
      require_stable_state:
        description: Require stable trend behavior before enforcing trend guardrails
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  trend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QUALITY_THRESHOLD: ${{ github.event.inputs.quality_threshold || vars.QUALITY_REQUIRED_SCORE || '165' }}
      QUALITY_TREND_MAX_CONSECUTIVE_FAILURES: ${{ github.event.inputs.max_consecutive_failures || vars.QUALITY_TREND_MAX_CONSECUTIVE_FAILURES || '3' }}
      QUALITY_TREND_MAX_SCORE_DROP_POINTS: ${{ github.event.inputs.max_score_drop_points || vars.QUALITY_TREND_MAX_SCORE_DROP_POINTS || '20' }}
      QUALITY_TREND_MIN_PASS_RATE_PERCENT: ${{ github.event.inputs.min_pass_rate_percent || vars.QUALITY_TREND_MIN_PASS_RATE_PERCENT || '70' }}
      QUALITY_TREND_REQUIRE_STABLE_STATE: ${{ github.event.inputs.require_stable_state || vars.QUALITY_TREND_REQUIRE_STABLE_STATE || 'true' }}
      QUALITY_TREND_HARD_BLOCK: ${{ github.event.inputs.quality_trend_hard_block || vars.QUALITY_TREND_HARD_BLOCK || 'false' }}
      QUALITY_EVIDENCE_MAX_AGE_MINUTES: ${{ vars.QUALITY_EVIDENCE_MAX_AGE_MINUTES || '180' }}
      QUALITY_EVIDENCE_MAX_TIMESTAMP_SKEW_MINUTES: ${{ vars.QUALITY_EVIDENCE_MAX_TIMESTAMP_SKEW_MINUTES || '15' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Language policy check
        run: |
          set -o pipefail
          node ./tools/check-language-policy.mjs --json 2>&1 | tee .tmp/language-policy-check.json

      - name: Restore quality trend history cache
        uses: actions/cache@v4
        with:
          path: .tmp/quality-trend.json
          key: quality-trend-${{ github.ref_name }}-${{ runner.os }}-v1
          restore-keys: |
            quality-trend-${{ github.ref_name }}-${{ runner.os }}-

      - name: Run quality trend smoke health check
        continue-on-error: ${{ (github.event_name == 'schedule' && env.QUALITY_TREND_HARD_BLOCK != 'true') || (github.event_name == 'workflow_dispatch' && github.event.inputs.enforce_trend_guardrails != 'true' && github.event.inputs.quality_trend_hard_block != 'true' && env.QUALITY_TREND_HARD_BLOCK != 'true') }}
        run: |
          set -o pipefail
          mkdir -p .tmp
          touch .tmp/quality-trend-health-smoke.json
          SMOKE_ARGS=(
            --json
            --require-score "${QUALITY_THRESHOLD}"
            --trend .tmp/quality-trend.json
            --summary .tmp/quality-trend-summary.md
            --guardrail .tmp/quality-trend-guardrail.json
            --quality .tmp/quality-scorecard.json
            --drill .tmp/circuit-recovery-drill-dry-run.json
            --verification .tmp/quality-ci-verification.json
            --digest-output .tmp/quality-trend-digest.md
            --digest-json .tmp/quality-trend-digest.json
            --check .tmp/quality-trend-check.json
            --recommendations .tmp/quality-trend-recommendations.md
            --incident-bundle .tmp/quality-trend-incident-bundle.md
            --incident-bundle-json .tmp/quality-trend-incident-bundle.json
            --max-consecutive-failures "${QUALITY_TREND_MAX_CONSECUTIVE_FAILURES}"
            --max-score-drop-points "${QUALITY_TREND_MAX_SCORE_DROP_POINTS}"
            --min-pass-rate-percent "${QUALITY_TREND_MIN_PASS_RATE_PERCENT}"
          )

          if [ "${QUALITY_TREND_REQUIRE_STABLE_STATE}" = "true" ]; then
            SMOKE_ARGS+=("--require-stable-state")
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
             [ "${{ github.event.inputs.enforce_trend_guardrails }}" = "true" ]; then
            SMOKE_ARGS+=("--enforce-guardrails")
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
             ( [ "${{ github.event.inputs.quality_trend_hard_block }}" = "true" ] ||
               [ "${QUALITY_TREND_HARD_BLOCK}" = "true" ] ); then
            SMOKE_ARGS+=("--hard-block")
          fi

          pnpm quality:trend-health-smoke -- "${SMOKE_ARGS[@]}" | tee .tmp/quality-trend-health-smoke.json

      - name: Verify quality trend artifact parity
        if: always()
        run: |
          set -o pipefail
          VERIFY_ARGS=(
            --json
            --quality .tmp/quality-scorecard.json
            --drill .tmp/circuit-recovery-drill-dry-run.json
            --incident-bundle-json .tmp/quality-trend-incident-bundle.json
            --incident-bundle-md .tmp/quality-trend-incident-bundle.md
            --incident-bundle-schema tools/quality-trend-incident-bundle.schema.json
            --require-incident-bundle
            --require-score "${QUALITY_THRESHOLD}"
          )
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
             [ "${{ github.event.inputs.quality_trend_hard_block }}" = "true" ]; then
            VERIFY_ARGS+=("--require-trend-health")
          elif [ "${QUALITY_TREND_HARD_BLOCK}" = "true" ]; then
            VERIFY_ARGS+=("--require-trend-health")
          fi

          pnpm quality:verify-artifacts -- "${VERIFY_ARGS[@]}" | tee .tmp/quality-trend-verify-artifacts.json

      - name: Append quality artifact verification to workflow summary
        if: always()
        run: |
          if [ -f .tmp/quality-trend-verify-artifacts.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Quality artifact verification result" >> "$GITHUB_STEP_SUMMARY"
            cat .tmp/quality-trend-verify-artifacts.json >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f .tmp/language-policy-check.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Language policy check" >> "$GITHUB_STEP_SUMMARY"
            node --input-type=module --eval '
              import { readFileSync } from "node:fs";

              const parsed = JSON.parse(readFileSync(".tmp/language-policy-check.json", "utf8"));
              const violations = Array.isArray(parsed.violations) ? parsed.violations : [];
              const inspected = parsed.inspected || {};

              console.log(`**Inspected files:** ${inspected.added ?? "unknown"}`);
              if (violations.length === 0) {
                console.log("PASS: no language policy violations.");
              } else {
                console.log(`FAIL: ${violations.length} violation(s).`);
                for (const item of violations) {
                  const boundary = item.boundary ?? "unknown";
                  const file = item.file ?? "unknown";
                  const extension = item.extension ?? "unknown";
                  const reason = item.reason ?? "unknown";
                  console.log(`- ${boundary}: ${file} (${extension}) ${reason}`);
                }
              }
            ' || true
          fi

      - name: Append quality trend smoke output to workflow summary
        if: always()
        run: |
          if [ -f .tmp/quality-trend-health-smoke.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Quality trend smoke output" >> "$GITHUB_STEP_SUMMARY"
            cat .tmp/quality-trend-health-smoke.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Append quality trend guardrail configuration to summary
        if: always()
        run: |
          {
            echo "### Quality trend guardrail config"
            echo ""
            echo "- max consecutive failures: ${QUALITY_TREND_MAX_CONSECUTIVE_FAILURES}"
            echo "- max score drop points: ${QUALITY_TREND_MAX_SCORE_DROP_POINTS}"
            echo "- min pass-rate percent: ${QUALITY_TREND_MIN_PASS_RATE_PERCENT}"
            echo "- require stable state: ${QUALITY_TREND_REQUIRE_STABLE_STATE}"
            echo "- hard block: ${QUALITY_TREND_HARD_BLOCK}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Append quality trend artifacts to workflow summary
        if: always()
        run: |
          if [ -f .tmp/quality-trend-summary.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Quality trend summary" >> "$GITHUB_STEP_SUMMARY"
            cat .tmp/quality-trend-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f .tmp/quality-trend-digest.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Quality trend digest" >> "$GITHUB_STEP_SUMMARY"
            cat .tmp/quality-trend-digest.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f .tmp/quality-trend-check.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Quality trend check" >> "$GITHUB_STEP_SUMMARY"
            cat .tmp/quality-trend-check.json >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f .tmp/quality-trend-recommendations.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Quality trend remediation recommendations" >> "$GITHUB_STEP_SUMMARY"
            cat .tmp/quality-trend-recommendations.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f .tmp/quality-trend-incident-bundle.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Quality trend incident bundle" >> "$GITHUB_STEP_SUMMARY"
            cat .tmp/quality-trend-incident-bundle.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assert required quality trend evidence artifacts
        if: always()
        run: |
          node ./tools/assert-quality-evidence-artifacts.mjs \
            --config tools/quality-evidence-assertions.quality-trend.json \
            --json \
            --max-age-minutes "${QUALITY_EVIDENCE_MAX_AGE_MINUTES}" \
            --max-timestamp-skew-minutes "${QUALITY_EVIDENCE_MAX_TIMESTAMP_SKEW_MINUTES}" \
            | tee .tmp/quality-trend-required-artifacts.json

      - name: Upload quality trend artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-trend
          path: |
            .tmp/quality-trend.json
            .tmp/quality-trend-summary.md
            .tmp/quality-trend-guardrail.json
            .tmp/quality-trend-digest.md
            .tmp/quality-trend-digest.json
            .tmp/quality-trend-check.json
            .tmp/quality-trend-recommendations.md
            .tmp/quality-trend-incident-bundle.md
            .tmp/quality-trend-incident-bundle.json
            .tmp/quality-scorecard.json
            .tmp/circuit-recovery-drill-dry-run.json
            .tmp/quality-ci-verification.json
            .tmp/quality-trend-verify-artifacts.json
            .tmp/quality-trend-health-smoke.json
            .tmp/language-policy-check.json
          retention-days: 180

