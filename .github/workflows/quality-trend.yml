name: Quality Trend Snapshot

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      quality_threshold:
        description: Minimum quality score required by gate
        required: false
        default: "165"
        type: string
      enforce_trend_guardrails:
        description: Fail if trend guardrails are triggered
        required: false
        default: false
        type: boolean
      max_consecutive_failures:
        description: Guardrail threshold for consecutive trend failures
        required: false
        default: "3"
        type: string
      max_score_drop_points:
        description: Guardrail threshold for single-run score drop points
        required: false
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  trend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality CI gate
        id: quality_gate
        continue-on-error: true
        run: pnpm quality:ci -- --json --require-score "${{ github.event.inputs.quality_threshold || '165' }}"

      - name: Append quality trend record
        if: always()
        continue-on-error: true
        run: |
          pnpm quality:trend-log \
            --quality .tmp/quality-scorecard.json \
            --verification .tmp/quality-ci-verification.json \
            --drill .tmp/circuit-recovery-drill-dry-run.json \
            --trend .tmp/quality-trend.json

      - name: Render quality trend summary
        if: always()
        continue-on-error: true
        run: pnpm quality:trend-summary -- --trend .tmp/quality-trend.json --output .tmp/quality-trend-summary.md --guard-output .tmp/quality-trend-guardrail.json

      - name: Enforce quality trend guardrails
        if: |
          always() &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.enforce_trend_guardrails == 'true'
        run: |
          pnpm quality:trend-summary -- \
            --trend .tmp/quality-trend.json \
            --output .tmp/quality-trend-summary.md \
            --guard-output .tmp/quality-trend-guardrail.json \
            --max-consecutive-failures "${{ github.event.inputs.max_consecutive_failures || '3' }}" \
            --max-score-drop-points "${{ github.event.inputs.max_score_drop_points || '20' }}" \
            --enforce-guardrails

      - name: Append trend summary to workflow summary
        if: always()
        run: |
          if [ -f .tmp/quality-trend-summary.md ]; then
            cat .tmp/quality-trend-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload quality trend artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-trend
          path: |
            .tmp/quality-trend.json
            .tmp/quality-trend-summary.md
            .tmp/quality-trend-guardrail.json
          retention-days: 180
