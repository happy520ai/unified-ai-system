name: HOL Plugin Scanner

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: HOL Plugin Scanner
        id: hol-scan
        continue-on-error: true
        uses: hashgraph-online/ai-plugin-scanner-action@8f0a503ca2a70c1968a9a883e11fdff5737b7909 # v1.2.514
        with:
          plugin_dir: "."
          profile: public-marketplace
          config: .plugin-scanner.toml
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          output: ai-plugin-scanner.sarif
          upload_sarif: false

      - name: Report scanner findings
        if: always()
        shell: bash
        run: |
          if [[ ! -s ai-plugin-scanner.sarif ]]; then
            echo "No scanner SARIF report was produced."
            exit 0
          fi

          jq -r '
            .runs[].results[]?
            | "[\(.level // "unknown")] \(.ruleId // "unknown-rule") \(.locations[0].physicalLocation.artifactLocation.uri // "unknown-path"):\(.locations[0].physicalLocation.region.startLine // 0) - \(.message.text // "No finding message")"
          ' ai-plugin-scanner.sarif

      - name: Upload scanner SARIF
        if: ${{ always() && hashFiles('ai-plugin-scanner.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: ai-plugin-scanner.sarif
          category: ai-plugin-scanner

      - name: Enforce scanner result
        if: steps.hol-scan.outcome == 'failure'
        shell: bash
        run: |
          echo "HOL Plugin Scanner reported a blocking result."
          exit 1
