name: IndexNow

on:
  page_build:
  workflow_dispatch:
    inputs:
      submit:
        description: Send the configured URLs instead of running validation only
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: indexnow-${{ github.event.build.commit || github.sha }}
  cancel-in-progress: true

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.build.status == 'built'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect public site changes
        id: site
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.event.build.commit }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [[ ! "$TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid Pages workflow SHA." >&2
            exit 1
          elif ! git merge-base --is-ancestor "$TRIGGER_SHA" HEAD; then
            echo "Pages workflow SHA is not on the checked-out default branch." >&2
            exit 1
          elif ! git rev-parse "${TRIGGER_SHA}^" >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${TRIGGER_SHA}^" "$TRIGGER_SHA" -- docs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.site.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Notify IndexNow
        if: steps.site.outputs.changed == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SUBMIT: ${{ inputs.submit }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_SUBMIT" != "true" ]]; then
            node tools/submit-indexnow.mjs
          else
            node tools/submit-indexnow.mjs --submit
          fi
