name: IndexNow

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  workflow_dispatch:
    inputs:
      submit:
        description: Send the configured URLs instead of running validation only
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: indexnow-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Detect public site changes
        id: site
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- docs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.site.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Notify IndexNow
        if: steps.site.outputs.changed == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SUBMIT: ${{ inputs.submit }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_SUBMIT" != "true" ]]; then
            node tools/submit-indexnow.mjs
          else
            node tools/submit-indexnow.mjs --submit
          fi
