name: Star Growth Thread Sync

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync-thread:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Sync growth thread
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm --version
          node ./tools/star-growth-sync-thread.mjs
