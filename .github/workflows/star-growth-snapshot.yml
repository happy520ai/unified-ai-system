name: Star Growth Snapshot

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Run growth reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/growth
          node tools/star-growth-check.mjs evidence --output .tmp/growth/star-growth-latest.md
          node tools/star-growth-check.mjs daily --output .tmp/growth/star-growth-daily.md
          node tools/star-growth-check.mjs check --output .tmp/growth/star-growth-check.md
          node tools/star-growth-feedback.mjs --output .tmp/growth/star-growth-feedback.md

          echo "## Star Growth Snapshot" >> "$GITHUB_STEP_SUMMARY"
          cat .tmp/growth/star-growth-check.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Feedback Snapshot" >> "$GITHUB_STEP_SUMMARY"
          cat .tmp/growth/star-growth-feedback.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload growth snapshot artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: star-growth-snapshot-${{ github.run_number }}
          path: |
            .tmp/growth/star-growth-latest.md
            .tmp/growth/star-growth-daily.md
            .tmp/growth/star-growth-check.md
            .tmp/growth/star-growth-feedback.md
