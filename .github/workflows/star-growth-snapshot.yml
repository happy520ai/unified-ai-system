name: Star Growth Snapshot

on:
  schedule:
    # Weekly was too coarse to attribute anything: a listing merged on a Tuesday and a
    # launch posted on a Friday both landed inside the same sample, so the funnel could
    # not say which event moved the needle. Day-level while the campaign is active.
    # This job only reads the API and uploads artifacts - the workflow that writes to a
    # public thread keeps its own, slower cadence.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Full history, deliberately: the sitemap freshness check below dates every page from its own last
        # commit, and measured 2026-09-29 22 of the 31 declared pages sit more than 50 commits behind the tip.
        # A shallow fetch would report those as unverifiable, which makes the check a green tick instead of a
        # defense. The repository is 46 MiB packed, so this costs seconds once a day.
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Run growth reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/growth
          node tools/star-growth-check.mjs evidence --output .tmp/growth/star-growth-latest.md
          node tools/star-growth-check.mjs daily --output .tmp/growth/star-growth-daily.md
          node tools/star-growth-check.mjs check --output .tmp/growth/star-growth-check.md
          node tools/star-growth-feedback.mjs --output .tmp/growth/star-growth-feedback.md

          echo "## Star Growth Snapshot" >> "$GITHUB_STEP_SUMMARY"
          cat .tmp/growth/star-growth-check.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Feedback Snapshot" >> "$GITHUB_STEP_SUMMARY"
          cat .tmp/growth/star-growth-feedback.md >> "$GITHUB_STEP_SUMMARY"

      - name: Summarise the growth doors
        env:
          GH_TOKEN: ${{ github.token }}
        # Read-only: the directory-presence probe walks public sitemaps and the topic probe reads the
        # GitHub API with the job's own read token. --allow-unreadable means a third-party site being
        # down is not a job failure - but the printed line says `unreadable` for that leg instead of
        # quietly reporting one fewer door, so a blind night cannot be misread as progress.
        run: |
          node tools/growth-door-state.mjs --allow-unreadable --output .tmp/growth/door-state.md
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Door State" >> "$GITHUB_STEP_SUMMARY"
          cat .tmp/growth/door-state.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check the published page dates against git
        # The freshness signal Google reads. tools/refresh-sitemap-dates.mjs stamps docs/sitemap.xml from git
        # when a page changes, but that only holds while someone remembers to run it - and the CI test for it
        # runs in a two-commit checkout, where most pages cannot be dated at all. This job has full history, so
        # this is where the claim is actually tested: exit 4 names a page whose lastmod is older than the commit
        # that changed it, exit 5 names one this clone could not read.
        run: |
          node tools/refresh-sitemap-dates.mjs --check

      - name: Check the listing census against a fresh probe
        # docs/listing-census.md advertises places outside this repository that carry an entry for us. Those
        # listings can be removed by their maintainer on any day, and a page that quietly went stale would be
        # worse than no page: it would be a claim about someone else that nobody can check. So the nightly
        # re-probes and fails on drift in either direction - a listing that vanished, or one that appeared and
        # is not yet on the page.
        # The token is declared here rather than trusted to the runner's implicit GITHUB_TOKEN: twelve carriers
        # means twelve api.github.com reads before a single listing file is fetched, and the anonymous budget is
        # 60 per hour per IP shared with everything else the machine does. Measured 2026-09-29 - the last three
        # of twelve came back UNREADABLE when this leg ran without a token, and the probe prints which identity
        # it used so a blind night cannot be filed as news about a carrier.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/render-listing-census.mjs --check --allow-unreadable

      - name: Sweep for repositories that mention us
        # Discovery rather than an invariant. GitHub code search for our own repository name, grouped by the
        # shape of the file that mentions us, so a catalogue that began carrying us without a pull request of
        # ours shows up here rather than six weeks later - which is exactly how four live listings were found
        # on 2026-09-29. Two things this deliberately does not do: it never calls "no search identity" a reading
        # of zero mentions, and it never adds a repository to the monitored set by itself. That edit belongs in
        # tools/check-carrier-presence.mjs, made by a person who has read the entry.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/growth-mention-sweep.mjs > .tmp/growth/mention-sweep.txt 2>&1 \
            || echo "sweep exit=$? - printed, not raised: a third-party search outage is not a build failure" >> .tmp/growth/mention-sweep.txt
          cat .tmp/growth/mention-sweep.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Re-read the quotations on the comparison page
        # That page quotes three other projects word for word and invites the reader to check it, so the check
        # belongs in the nightly rather than in someone's memory. --allow-unreadable is for other people's
        # outages; a quotation that no longer matches its source exits 4 and reddens the job, because at that
        # point the page is misquoting a named company. The coverage row inside the tool refuses a run that
        # parsed fewer quotations than the page contains, so a narrowing parser cannot report success.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/check-comparison-quotes.mjs --allow-unreadable

      - name: Upload growth snapshot artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: star-growth-snapshot-${{ github.run_number }}
          path: |
            .tmp/growth/star-growth-latest.md
            .tmp/growth/star-growth-daily.md
            .tmp/growth/star-growth-check.md
            .tmp/growth/star-growth-feedback.md
            .tmp/growth/door-state.md
            .tmp/growth/mention-sweep.txt
