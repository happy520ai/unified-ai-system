name: Star Growth Snapshot

on:
  schedule:
    # Weekly was too coarse to attribute anything: a listing merged on a Tuesday and a
    # launch posted on a Friday both landed inside the same sample, so the funnel could
    # not say which event moved the needle. Day-level while the campaign is active.
    # This job only reads the API and uploads artifacts - the workflow that writes to a
    # public thread keeps its own, slower cadence.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Run growth reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/growth
          node tools/star-growth-check.mjs evidence --output .tmp/growth/star-growth-latest.md
          node tools/star-growth-check.mjs daily --output .tmp/growth/star-growth-daily.md
          node tools/star-growth-check.mjs check --output .tmp/growth/star-growth-check.md
          node tools/star-growth-feedback.mjs --output .tmp/growth/star-growth-feedback.md

          echo "## Star Growth Snapshot" >> "$GITHUB_STEP_SUMMARY"
          cat .tmp/growth/star-growth-check.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Feedback Snapshot" >> "$GITHUB_STEP_SUMMARY"
          cat .tmp/growth/star-growth-feedback.md >> "$GITHUB_STEP_SUMMARY"

      - name: Notify search engines about published pages
        run: |
          # The daily report reads our own index coverage and found 8 of 14 published pages missing.
          # Notifying is the cheap half of that; this step is the difference between a fix that ran
          # once and a defence that keeps running. A third-party endpoint being down must not redden
          # the snapshot, but it must not vanish either, so the exit code is echoed into the summary
          # where it can be compared against the coverage row the next morning.
          node tools/notify-indexnow.mjs | tee .tmp/growth/indexnow.log
          status=${PIPESTATUS[0]}
          echo "indexnow exit=$status" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning::IndexNow notification incomplete (exit 1 rejected / exit 3 inconclusive) - see the index-coverage row tomorrow"
          fi

      - name: Upload growth snapshot artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: star-growth-snapshot-${{ github.run_number }}
          path: |
            .tmp/growth/star-growth-latest.md
            .tmp/growth/star-growth-daily.md
            .tmp/growth/star-growth-check.md
            .tmp/growth/star-growth-feedback.md
