name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QUALITY_THRESHOLD: ${{ vars.QUALITY_REQUIRED_SCORE || '165' }}
      QUALITY_TREND_MAX_CONSECUTIVE_FAILURES: ${{ vars.QUALITY_TREND_MAX_CONSECUTIVE_FAILURES || '3' }}
      QUALITY_TREND_MAX_SCORE_DROP_POINTS: ${{ vars.QUALITY_TREND_MAX_SCORE_DROP_POINTS || '20' }}
      QUALITY_TREND_MIN_PASS_RATE_PERCENT: ${{ vars.QUALITY_TREND_MIN_PASS_RATE_PERCENT || '70' }}
      QUALITY_TREND_REQUIRE_STABLE_STATE: ${{ vars.QUALITY_TREND_REQUIRE_STABLE_STATE || 'true' }}
      QUALITY_TREND_HARD_BLOCK: ${{ vars.QUALITY_TREND_HARD_BLOCK || 'false' }}
      QUALITY_REQUIRE_TREND_HEALTH: ${{ vars.QUALITY_REQUIRE_TREND_HEALTH || 'true' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.23.x"
          cache: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore quality trend history cache
        uses: actions/cache@v4
        with:
          path: .tmp/quality-trend.json
          key: quality-trend-${{ github.ref_name }}-${{ runner.os }}-v1
          restore-keys: |
            quality-trend-${{ github.ref_name }}-${{ runner.os }}-

      - name: Install browser for Prompt Lab smoke test
        run: pnpm --filter @unified-ai-system/web-agent exec playwright install --with-deps chromium

      - name: Workspace checks
        run: pnpm check

      - name: Maintained tests
        run: pnpm test

      - name: Public repository hygiene
        run: pnpm check:public

      - name: Docker Compose manifest
        run: docker compose config --quiet

      - name: Public clone runtime
        run: pnpm verify:public-clone

      - name: Run quality trend smoke health check
        run: |
          SMOKE_ARGS=(
            --json
            --require-score "${QUALITY_THRESHOLD}"
            --trend .tmp/quality-trend.json
            --summary .tmp/quality-trend-summary.md
            --guardrail .tmp/quality-trend-guardrail.json
            --quality .tmp/quality-scorecard.json
            --drill .tmp/circuit-recovery-drill-dry-run.json
            --verification .tmp/quality-ci-verification.json
            --digest-output .tmp/quality-trend-digest.md
            --digest-json .tmp/quality-trend-digest.json
            --check .tmp/quality-trend-check.json
            --recommendations .tmp/quality-trend-recommendations.md
            --incident-bundle .tmp/quality-trend-incident-bundle.md
            --incident-bundle-json .tmp/quality-trend-incident-bundle.json
            --max-consecutive-failures "${QUALITY_TREND_MAX_CONSECUTIVE_FAILURES}"
            --max-score-drop-points "${QUALITY_TREND_MAX_SCORE_DROP_POINTS}"
            --min-pass-rate-percent "${QUALITY_TREND_MIN_PASS_RATE_PERCENT}"
            --max-summary-reasons 8
            --allow-warnings
            --enforce-guardrails
          )

          if [ "${QUALITY_REQUIRE_TREND_HEALTH}" = "false" ]; then
            SMOKE_ARGS+=("--no-trend-health")
          fi
          if [ "${QUALITY_TREND_REQUIRE_STABLE_STATE}" = "true" ]; then
            SMOKE_ARGS+=("--require-stable-state")
          fi
          if [ "${QUALITY_TREND_HARD_BLOCK}" = "true" ]; then
            SMOKE_ARGS+=("--hard-block")
          fi

          pnpm quality:trend-health-smoke -- "${SMOKE_ARGS[@]}"

      - name: Verify quality trend artifact parity
        run: |
          VERIFY_ARGS=(
            --json
            --quality .tmp/quality-scorecard.json
            --drill .tmp/circuit-recovery-drill-dry-run.json
            --incident-bundle-json .tmp/quality-trend-incident-bundle.json
            --incident-bundle-md .tmp/quality-trend-incident-bundle.md
            --incident-bundle-schema tools/quality-trend-incident-bundle.schema.json
            --require-incident-bundle
            --require-score "${QUALITY_THRESHOLD}"
          )

          if [ "${QUALITY_REQUIRE_TREND_HEALTH}" = "true" ]; then
            VERIFY_ARGS+=("--require-trend-health")
          fi

          pnpm quality:verify-artifacts -- "${VERIFY_ARGS[@]}"

      - name: Append quality trend guardrail configuration to summary
        if: always()
        run: |
          {
            echo "### Quality trend guardrail config"
            echo ""
            echo "- max consecutive failures: ${QUALITY_TREND_MAX_CONSECUTIVE_FAILURES}"
            echo "- max score drop points: ${QUALITY_TREND_MAX_SCORE_DROP_POINTS}"
            echo "- min pass-rate percent: ${QUALITY_TREND_MIN_PASS_RATE_PERCENT}"
            echo "- require stable state: ${QUALITY_TREND_REQUIRE_STABLE_STATE}"
            echo "- hard block: ${QUALITY_TREND_HARD_BLOCK}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Append quality trend artifacts to workflow summary
        if: always()
        run: |
          if [ -f .tmp/quality-trend-summary.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Quality trend summary" >> "$GITHUB_STEP_SUMMARY"
            cat .tmp/quality-trend-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f .tmp/quality-trend-digest.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Quality trend digest" >> "$GITHUB_STEP_SUMMARY"
            cat .tmp/quality-trend-digest.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f .tmp/quality-trend-check.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Quality trend check" >> "$GITHUB_STEP_SUMMARY"
            cat .tmp/quality-trend-check.json >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f .tmp/quality-trend-recommendations.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Quality trend remediation recommendations" >> "$GITHUB_STEP_SUMMARY"
            cat .tmp/quality-trend-recommendations.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f .tmp/quality-trend-incident-bundle.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Quality trend incident bundle" >> "$GITHUB_STEP_SUMMARY"
            cat .tmp/quality-trend-incident-bundle.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload quality scorecard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-scorecard
          path: |
            .tmp/quality-scorecard.json
            .tmp/circuit-recovery-drill-dry-run.json
            .tmp/quality-ci-verification.json
            .tmp/quality-trend.json
            .tmp/quality-trend-summary.md
            .tmp/quality-trend-guardrail.json
            .tmp/quality-trend-digest.md
            .tmp/quality-trend-digest.json
            .tmp/quality-trend-check.json
            .tmp/quality-trend-recommendations.md
            .tmp/quality-trend-incident-bundle.md
            .tmp/quality-trend-incident-bundle.json
          retention-days: 30

      - name: Codex MCP server
        run: |
          pnpm verify:mcp
          pnpm smoke:mcp --json

      - name: Terminal CLI
        run: |
          pnpm gateway doctor --json
          pnpm gateway demo --json

      - name: Go prompt enhancement example
        run: go run docs/examples/prompt-enhancement.go --help

      - name: Shared SDK prompt enhancement example
        run: node --check docs/examples/shared-sdk-prompt-enhancement.mjs

      - name: Shared SDK cancellation example
        run: node docs/examples/shared-sdk-cancellation.mjs

      - name: Prompt enhancement contract fixture
        run: node docs/examples/prompt-enhancement-contract.mjs

      - name: Prompt enhancement evaluation
        run: pnpm eval:prompt-enhancement -- --json

      - name: C# prompt enhancement example
        run: |
          dotnet restore docs/examples/prompt-enhancement.csproj
          dotnet build docs/examples/prompt-enhancement.csproj --no-restore --nologo
          dotnet run --project docs/examples/prompt-enhancement.csproj --no-build -- --help
