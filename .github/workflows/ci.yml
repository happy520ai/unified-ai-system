name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Workspace checks
        run: pnpm check

      - name: Maintained tests
        run: pnpm test

      - name: Public repository hygiene
        run: pnpm check:public

      - name: Public clone runtime
        run: pnpm verify:public-clone

      - name: Terminal demo
        run: pnpm demo -- --json
