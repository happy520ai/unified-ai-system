name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.23.x"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser for Prompt Lab smoke test
        run: pnpm --filter @unified-ai-system/web-agent exec playwright install --with-deps chromium

      - name: Workspace checks
        run: pnpm check

      - name: Maintained tests
        run: pnpm test

      - name: Public repository hygiene
        run: pnpm check:public

      - name: Docker Compose manifest
        run: docker compose config --quiet

      - name: Public clone runtime
        run: pnpm verify:public-clone

      - name: Codex MCP server
        run: |
          pnpm verify:mcp
          pnpm smoke:mcp --json

      - name: Terminal CLI
        run: |
          pnpm gateway doctor --json
          pnpm gateway demo --json

      - name: Go prompt enhancement example
        run: go run docs/examples/prompt-enhancement.go --help

      - name: C# prompt enhancement example
        run: |
          dotnet restore docs/examples/prompt-enhancement.csproj
          dotnet build docs/examples/prompt-enhancement.csproj --no-restore --nologo
          dotnet run --project docs/examples/prompt-enhancement.csproj --no-build -- --help
