name: CodeQL SAST

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@51f27fe426459f2ba98e0f5cddb852c2b3354c8a # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Use the default security queries plus the security-extended suite
          # for deeper analysis on JavaScript/TypeScript code.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@51f27fe426459f2ba98e0f5cddb852c2b3354c8a # v3
        with:
          category: "/language:${{ matrix.language }}"
